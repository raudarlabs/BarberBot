<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Custom True · Дашборд</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: #120d0f; --card: #1d1416; --card2: #251a1d; --line: rgba(214,150,160,.16);
    --accent: #e4b8b2; --accent-hi: #f5d9d4; --wine: #a8435f;
    --cream: #f3ebe8; --muted: #a8939a; --good: #7fcf9a; --bad: #ef6b62;
  }
  * { box-sizing: border-box; margin: 0; }
  html { -webkit-text-size-adjust: 100%; }
  body { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif; background: var(--bg);
         color: var(--cream); padding: 14px 14px calc(28px + env(safe-area-inset-bottom)); font-variant-numeric: tabular-nums; }
  main { max-width: 820px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; }
  header { display: flex; justify-content: space-between; align-items: flex-end; gap: 8px; padding: 4px 2px 0; }
  h1 { font-size: 20px; font-weight: 700; letter-spacing: .2px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .brand { color: var(--accent); font-size: 12px; font-weight: 600; letter-spacing: .3px; }
  .upd { color: var(--muted); font-size: 12px; white-space: nowrap; }
  .seg, .chips { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
  .seg::-webkit-scrollbar, .chips::-webkit-scrollbar { display: none; }
  .seg button { flex: none; border: 1px solid var(--line); background: var(--card); color: var(--muted); font: inherit;
                font-size: 13px; padding: 7px 12px; border-radius: 999px; cursor: pointer; }
  .seg button.on { background: var(--accent); color: #1c1113; border-color: var(--accent); font-weight: 600; }
  .chips button { flex: none; border: 1px solid var(--line); background: none; color: var(--cream); font: inherit; font-size: 12px;
                  padding: 5px 10px; border-radius: 999px; cursor: pointer; }
  .chips button.on { border-color: var(--accent); color: var(--accent); }
  .kpis { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
  @media (min-width: 640px) { .kpis { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
  .kpi { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 12px 14px; min-width: 0; }
  .kpi .l { color: var(--muted); font-size: 12px; }
  .kpi .v { font-size: 24px; font-weight: 700; margin-top: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .kpi .s { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .up { color: var(--good); } .down { color: var(--bad); }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 14px; min-width: 0; }
  .card h2 { font-size: 15px; font-weight: 600; display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 12px; }
  .card h2 span { color: var(--muted); font-size: 12px; font-weight: 400; text-align: right; }
  .tabs { display: inline-flex; background: var(--card2); border-radius: 999px; padding: 2px; }
  .tabs button { border: 0; background: none; color: var(--muted); font: inherit; font-size: 12px; padding: 4px 10px; border-radius: 999px; cursor: pointer; }
  .tabs button.on { background: var(--wine); color: var(--cream); }
  .chart { display: flex; align-items: flex-end; gap: 2px; height: 140px; }
  .chart .b { flex: 1; min-width: 2px; background: var(--wine); border-radius: 4px 4px 1px 1px; cursor: pointer; }
  .chart .b.we { background: #c25a78; }
  .chart .b.today { background: var(--accent); }
  .chart .b.sel { outline: 2px solid var(--accent-hi); outline-offset: 1px; }
  .axis { display: flex; justify-content: space-between; color: var(--muted); font-size: 11px; margin-top: 6px; }
  .tip { min-height: 18px; font-size: 13px; color: var(--accent-hi); margin-top: 8px; }
  .stack { display: flex; height: 14px; border-radius: 999px; overflow: hidden; background: var(--card2); }
  .stack i { display: block; height: 100%; }
  .legend { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-top: 10px; font-size: 13px; }
  .legend > span { display: inline-flex; align-items: center; gap: 6px; }
  .dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }
  .rows { display: flex; flex-direction: column; gap: 10px; }
  .row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 3px 10px; align-items: baseline; }
  .row .n { font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row .m { font-size: 14px; font-weight: 600; text-align: right; white-space: nowrap; }
  .row .sub { grid-column: 1 / -1; color: var(--muted); font-size: 12px; }
  .row .bar { grid-column: 1 / -1; height: 6px; border-radius: 999px; background: var(--card2); overflow: hidden; }
  .row .bar i { display: block; height: 100%; background: linear-gradient(90deg, var(--wine), var(--accent)); border-radius: 999px; }
  .row.click { cursor: pointer; }
  .heat { display: grid; grid-template-columns: 22px repeat(var(--cols), minmax(0, 1fr)); gap: 3px; font-size: 10px; color: var(--muted); align-items: center; }
  .heat i { aspect-ratio: 1; border-radius: 4px; display: block; }
  .heat .h { text-align: center; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { padding: 7px 4px; text-align: right; white-space: nowrap; }
  th { color: var(--muted); font-weight: 500; font-size: 11px; }
  th:first-child, td:first-child { text-align: left; }
  tr + tr td { border-top: 1px solid var(--line); }
  .two { display: grid; gap: 12px; }
  @media (min-width: 700px) { .two { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); } }
  .msg { color: var(--muted); text-align: center; padding: 26px 10px; font-size: 14px; }
  .bad { color: var(--bad); }
  .login { display: flex; flex-direction: column; gap: 10px; }
  .login input { font: inherit; font-size: 16px; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--card2); color: var(--cream); }
  .login button { font: inherit; font-size: 16px; font-weight: 700; padding: 13px; border-radius: 12px; border: 0; background: var(--accent); color: #1c1113; cursor: pointer; }
  .note { color: var(--muted); font-size: 11px; line-height: 1.5; padding: 0 2px; }
  .skel { background: linear-gradient(90deg, var(--card) 0%, var(--card2) 50%, var(--card) 100%); background-size: 200% 100%;
          animation: sh 1.2s infinite linear; border-radius: 16px; height: 86px; }
  @keyframes sh { to { background-position: -200% 0; } }
</style>
</head>
<body>
<main>
  <header><div style="min-width:0"><div class="brand">Custom True</div><h1 id="title">Дашборд</h1></div><span class="upd" id="upd"></span></header>
  <div class="seg" id="periods">
    <button data-p="month">Цей місяць</button><button data-p="prev">Минулий місяць</button>
    <button data-p="7">7 днів</button><button data-p="30">30 днів</button><button data-p="90">90 днів</button>
  </div>
  <div class="chips" id="staff" hidden></div>
  <div id="out"></div>
  <p class="note" id="note"></p>
</main>
<script>
(() => {
  const tg = window.Telegram && window.Telegram.WebApp;
  const initData = (tg && tg.initData) || '';
  if (tg) { try { tg.ready(); tg.expand(); tg.setHeaderColor('#120d0f'); tg.setBackgroundColor('#120d0f'); } catch (e) {} }

  const GAMES = { dryer: 'Фен-пілот', fade: 'Ідеальний фейд', beard: 'Борода-ніндзя', snake: 'Змійка', blocks: 'Укладка' };
  const SRC = { bot: ['Бот Telegram', '#e4b8b2'], online: ['Онлайн-запис', '#a8435f'], admin: ['Адміністратор', '#6d5a60'] };
  const WD = ['Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб', 'Нд'];
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const num = (v) => Math.round(v || 0).toLocaleString('uk-UA');
  const uah = (v) => num(v) + ' ₴';
  const dm = (iso) => iso.slice(8, 10) + '.' + iso.slice(5, 7);
  const wdi = (iso) => (new Date(iso + 'T12:00:00').getDay() + 6) % 7;
  const wd = (iso) => WD[wdi(iso)];
  const store = { get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
                  set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} } };

  let period = store.get('dash.p') || 'month', staff = '', key = store.get('dash.key') || '', data = null, metric = 'visits', sel = -1;

  function delta(cur, prev) {
    if (cur == null || !prev) return '';
    const p = Math.round(100 * (cur - prev) / prev);
    return `<span class="${p >= 0 ? 'up' : 'down'}">${p >= 0 ? '▲' : '▼'} ${Math.abs(p)}%</span> `;
  }
  const kpi = (l, v, s) => `<div class="kpi"><div class="l">${l}</div><div class="v">${v}</div><div class="s">${s || '&nbsp;'}</div></div>`;

  function chart(b) {
    const cur = b.current, series = cur.daily[metric] || [], max = Math.max(1, ...series);
    const today = new Date().toLocaleDateString('sv-SE', { timeZone: 'Europe/Kyiv' });
    const bars = series.map((v, i) => {
      const d = cur.days[i];
      return `<div class="b${wdi(d) >= 5 ? ' we' : ''}${d === today ? ' today' : ''}${i === sel ? ' sel' : ''}" data-i="${i}" style="height:${Math.max(2, Math.round(v / max * 100))}%"></div>`;
    }).join('');
    const tabs = cur.daily.revenue ? `<div class="tabs"><button data-m="visits" class="${metric === 'visits' ? 'on' : ''}">Візити</button><button data-m="revenue" class="${metric === 'revenue' ? 'on' : ''}">Виручка</button></div>` : '';
    let tip = 'Натисніть на стовпчик, щоб побачити день';
    if (sel >= 0 && cur.days[sel]) {
      const d = cur.days[sel];
      tip = `${wd(d)}, ${dm(d)}: візитів ${cur.daily.visits[sel]}` + (cur.daily.revenue ? ` · ${uah(cur.daily.revenue[sel])}` : '') + ` · записів ${cur.daily.booked[sel]}`;
    }
    return `<div class="card"><h2>По днях ${tabs}</h2><div class="chart">${bars}</div>
      <div class="axis"><span>${dm(cur.days[0])}</span><span>сб і нд — світліші</span><span>${dm(cur.days[cur.days.length - 1])}</span></div>
      <div class="tip">${tip}</div></div>`;
  }

  function sources(b) {
    const s = b.current.sources, total = Object.values(s).reduce((a, x) => a + x, 0);
    if (!total) return '';
    const parts = Object.keys(SRC).map((k) => `<i style="width:${100 * s[k] / total}%;background:${SRC[k][1]}"></i>`).join('');
    const leg = Object.keys(SRC).map((k) => `<span><i class="dot" style="background:${SRC[k][1]}"></i>${SRC[k][0]} <b>${s[k]}</b> <span style="color:var(--muted)">${Math.round(100 * s[k] / total)}%</span></span>`).join('');
    return `<div class="card"><h2>Звідки записи <span>${total} записів</span></h2><div class="stack">${parts}</div><div class="legend">${leg}</div>
      <p class="note" style="margin-top:10px;padding:0">Через бот у попередньому періоді: ${b.previous.sources.bot}</p></div>`;
  }

  function barbers(b, clickable) {
    const rows = b.current.barbers;
    if (rows.length < 2) return '';
    const money = rows[0].revenue != null, val = (r) => money ? r.revenue : r.visits, max = Math.max(1, ...rows.map(val));
    return `<div class="card"><h2>Майстри <span>${clickable ? 'натисніть, щоб відкрити окремо' : ''}</span></h2><div class="rows">${rows.map((r) => `
      <div class="row${clickable ? ' click' : ''}" data-staff="${r.id}"><div class="n">${esc(r.name)}</div><div class="m">${money ? uah(r.revenue) : r.visits + ' віз.'}</div>
      <div class="bar"><i style="width:${Math.round(100 * val(r) / max)}%"></i></div>
      <div class="sub">${r.visits} візитів${money ? ' · чек ' + uah(r.avg) : ''} · клієнтів ${r.clients}${r.no_show ? ' · не прийшли ' + r.no_show : ''}${r.bot ? ' · через бот ' + r.bot : ''}${r.unmarked ? ' · не відмічено ' + r.unmarked : ''}</div></div>`).join('')}</div></div>`;
  }

  function services(b) {
    const rows = b.current.services;
    if (!rows.length) return '';
    const max = Math.max(1, ...rows.map((r) => r.count));
    return `<div class="card"><h2>Послуги <span>топ ${rows.length}</span></h2><div class="rows">${rows.map((r) => `
      <div class="row"><div class="n">${esc(r.title)}</div><div class="m">${r.count}</div>
      <div class="bar"><i style="width:${Math.round(100 * r.count / max)}%"></i></div>
      ${r.revenue != null ? `<div class="sub">${uah(r.revenue)}</div>` : ''}</div>`).join('')}</div></div>`;
  }

  function heat(b) {
    const h = b.current.heat;
    let lo = 23, hi = 0;
    h.forEach((row) => row.forEach((v, i) => { if (v) { lo = Math.min(lo, i); hi = Math.max(hi, i); } }));
    if (lo > hi) return '';
    lo = Math.min(lo, 10); hi = Math.max(hi, 19);
    const max = Math.max(1, ...h.flat());
    let cells = '<span></span>';
    for (let i = lo; i <= hi; i++) cells += `<span class="h">${i % 2 === 0 ? i : ''}</span>`;
    h.forEach((row, d) => {
      cells += `<span>${WD[d]}</span>`;
      for (let i = lo; i <= hi; i++) {
        const bg = row[i] ? `rgba(228,184,178,${(0.15 + 0.85 * row[i] / max).toFixed(2)})` : 'var(--card2)';
        cells += `<i title="${WD[d]} ${i}:00 — ${row[i]}" style="background:${bg}"></i>`;
      }
    });
    return `<div class="card"><h2>Коли найбільше візитів <span>день × година</span></h2><div class="heat" style="--cols:${hi - lo + 1}">${cells}</div></div>`;
  }

  function upcoming(b) {
    const u = b.upcoming, days = Object.entries(u.by_day);
    if (!u.count) return `<div class="card"><h2>Наступні 7 днів</h2><p class="msg" style="padding:8px">Записів поки немає</p></div>`;
    const max = Math.max(1, ...days.map(([, v]) => v));
    return `<div class="card"><h2>Наступні 7 днів <span>${u.count} записів${u.expected != null ? ' · ~' + uah(u.expected) : ''}</span></h2>
      <div class="rows">${days.map(([d, v]) => `<div class="row"><div class="n">${wd(d)}, ${dm(d)}</div><div class="m">${v}</div><div class="bar"><i style="width:${Math.round(100 * v / max)}%"></i></div></div>`).join('')}</div></div>`;
  }

  function bot(d) {
    if (!d.bot) return '';
    const e = d.bot.events, c = d.bot.chats;
    const names = { booked: 'Записи', moved: 'Переноси', cancelled: 'Скасування', reminded: 'Нагадування' };
    const rows = Object.keys(names).map((k) => `<tr><td>${names[k]}</td><td>${e[k].today}</td><td>${e[k].week}</td><td>${e[k].month}</td><td>${e[k].all}</td></tr>`).join('');
    return `<div class="card"><h2>Бот <span>${c.total} клієнтів · сьогодні ${c.day} · 7 днів ${c.week}</span></h2>
      <table><tr><th></th><th>Сьогодні</th><th>7 днів</th><th>Місяць</th><th>Всього</th></tr>${rows}</table></div>`;
  }

  function games(d) {
    if (!d.games) return '';
    const g = d.games.games;
    const rows = Object.keys(GAMES).map((k) => { const x = g[k] || {}; return `<tr><td>${GAMES[k]}</td><td>${(x.plays || {}).today || 0}</td><td>${(x.plays || {}).month || 0}</td><td>${(x.players || {}).month || 0}</td><td>${x.best_month ?? '—'}</td></tr>`; }).join('');
    const hub = (g.hub || {}).opens || {};
    return `<div class="card"><h2>Ігри <span>хаб: сьогодні ${hub.today || 0} · місяць ${hub.month || 0}</span></h2>
      <table><tr><th></th><th>Сьогодні</th><th>Місяць</th><th>Гравців</th><th>Рекорд</th></tr>${rows}</table></div>`;
  }

  function render() {
    const d = data, b = d.bookings, admin = d.role === 'admin';
    $('upd').textContent = d.generated ? 'оновлено ' + d.generated : '';
    if (b.error) {
      $('out').innerHTML = '<p class="msg bad">Altegio зараз не відповідає. Спробуйте за хвилину.</p>' + (admin ? bot(d) + games(d) : '');
      return;
    }
    const c = b.current.totals, p = b.previous.totals, money = c.revenue != null;
    const one = d.staff && b.current.barbers[0] ? b.current.barbers[0].name : '';
    $('title').textContent = one || (admin ? 'Дашборд' : 'Моя статистика');
    let html = `<p class="note">${esc(b.label)}: ${dm(b.current.first)}–${dm(b.current.last)} · порівняння з ${dm(b.previous.first)}–${dm(b.previous.last)}</p><div class="kpis">`;
    if (money) html += kpi('Виручка', uah(c.revenue), delta(c.revenue, p.revenue) + 'було ' + uah(p.revenue));
    html += kpi('Візити', num(c.visits), delta(c.visits, p.visits) + `~${c.per_day} на день`);
    if (money) html += kpi('Середній чек', uah(c.avg_check), delta(c.avg_check, p.avg_check) + 'було ' + uah(p.avg_check));
    html += kpi('Клієнти', num(c.clients), `повторних ${c.repeat_clients}`);
    html += kpi('Не прийшли', num(c.no_show), `${c.no_show_rate}% · не відмічено ${c.unmarked}`);
    html += kpi('Наступні 7 днів', num(b.upcoming.count), b.upcoming.expected != null ? '~' + uah(b.upcoming.expected) : 'записів');
    html += '</div>' + chart(b);
    html += `<div class="two">${barbers(b, admin && !d.staff)}${sources(b)}</div>`;
    html += `<div class="two">${services(b)}${upcoming(b)}</div>` + heat(b);
    if (admin && !d.staff) html += `<div class="two">${bot(d)}${games(d)}</div>`;
    $('out').innerHTML = html;
    $('note').textContent = 'Дані з Altegio: візит — запис зі статусом «клієнт прийшов», виручка — вартість послуг після знижок. ' +
      'Скасовані записи не рахуються. Дні за київським часом; порівняння — з таким самим попереднім відрізком.';
  }

  function staffChips() {
    const el = $('staff');
    if (!data || data.role !== 'admin' || data.bookings.error) { el.hidden = true; return; }
    if (!staff) el.dataset.list = JSON.stringify(data.bookings.current.barbers.map((r) => [r.id, r.name]));
    const list = JSON.parse(el.dataset.list || '[]');
    el.innerHTML = `<button data-s="" class="${staff ? '' : 'on'}">Усі майстри</button>` +
      list.map(([id, n]) => `<button data-s="${id}" class="${String(id) === staff ? 'on' : ''}">${esc(n)}</button>`).join('');
    el.hidden = list.length < 2;
  }

  function loginForm(msg) {
    $('out').innerHTML = `<div class="card login"><label for="key" style="color:var(--muted);font-size:13px">Відкрийте дашборд з бота (/admin → Статистика) або введіть ключ персоналу</label>
      <input id="key" type="password" autocomplete="off" value="${esc(key)}"><button id="go" type="button">Показати</button>${msg ? `<p class="bad" style="font-size:13px">${msg}</p>` : ''}</div>`;
    $('go').onclick = () => { key = $('key').value.trim(); store.set('dash.key', key); load(); };
  }

  async function load(fresh) {
    document.querySelectorAll('#periods button').forEach((b) => b.classList.toggle('on', b.dataset.p === period));
    if (!initData && !key) { loginForm(); return; }
    sel = -1;
    $('out').innerHTML = '<div class="kpis">' + '<div class="skel"></div>'.repeat(6) + '</div><div class="skel" style="height:200px;margin-top:12px"></div>' +
      '<p class="msg">Збираю дані з Altegio… перше відкриття довгого періоду може тривати до хвилини</p>';
    const headers = initData ? { 'X-Telegram-Init-Data': initData } : { 'X-Admin-Key': key };
    const q = new URLSearchParams({ p: period });
    if (staff) q.set('staff', staff);
    if (fresh) q.set('fresh', '1');
    let res;
    try { res = await fetch('/api/dashboard?' + q, { headers }); } catch (e) { $('out').innerHTML = '<p class="msg bad">Немає звʼязку</p>'; return; }
    if (res.status === 403) {
      if (initData) $('out').innerHTML = '<p class="msg bad">Дашборд доступний адміністраторам і майстрам команди</p>';
      else loginForm('Невірний ключ');
      return;
    }
    if (!res.ok) { $('out').innerHTML = `<p class="msg bad">Помилка (${res.status}). Спробуйте ще раз.</p>`; return; }
    data = await res.json();
    staffChips();
    render();
  }

  $('periods').addEventListener('click', (e) => { const p = e.target.dataset && e.target.dataset.p; if (p) { period = p; store.set('dash.p', p); load(); } });
  $('staff').addEventListener('click', (e) => { const s = e.target.dataset && e.target.dataset.s; if (s !== undefined) { staff = s; load(); } });
  $('out').addEventListener('click', (e) => {
    const bar = e.target.closest('.b'), tab = e.target.closest('[data-m]'), row = e.target.closest('.row.click');
    if (bar) { sel = +bar.dataset.i; render(); }
    else if (tab) { metric = tab.dataset.m; render(); }
    else if (row) { staff = row.dataset.staff; load(); window.scrollTo(0, 0); }
  });
  load();
})();
</script>
</body>
</html>
