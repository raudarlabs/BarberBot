<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Видача призів</title>
<style>
  :root { --bg: #120d0f; --card: #1d1416; --line: rgba(214,150,160,.25); --accent: #e4b8b2; --accent-hi: #f5d9d4; --cream: #f3ebe8; --muted: #a8939a; --red: #e0433a; --green: #4fd18b; }
  * { box-sizing: border-box; margin: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--cream); padding: 24px 16px; }
  main { max-width: 420px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
  h1 { color: var(--accent); font-size: 24px; }
  p { color: var(--muted); font-size: 14px; line-height: 1.4; }
  label { font-size: 13px; color: var(--muted); display: block; margin-bottom: 6px; }
  input { width: 100%; font-size: 18px; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--card); color: var(--cream); }
  #code { font: 700 24px ui-monospace, Menlo, monospace; letter-spacing: .18em; text-transform: uppercase; }
  button { width: 100%; font-size: 17px; font-weight: 800; padding: 14px; border-radius: 12px; border: 0; cursor: pointer; background: linear-gradient(135deg, var(--accent-hi), var(--accent)); color: #1c1113; }
  button.secondary { background: var(--card); color: var(--cream); border: 1px solid var(--line); }
  .result { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px; display: none; }
  .result.show { display: block; }
  .result h2 { font-size: 20px; margin-bottom: 6px; }
  .ok { color: var(--green); } .bad { color: var(--red); }
  .row { display: flex; justify-content: space-between; padding: 4px 0; font-size: 15px; }
  .row span:first-child { color: var(--muted); }
</style>
</head>
<body>
<main>
  <h1>🏆 Видача призів</h1>
  <p>Клієнт показує 8-значний код на екрані «Ти переміг!» у Barber Games. Перевір код і натисни «Видати приз» — повторно той самий код вже не спрацює. Якщо рахунок виглядає нереально великим для тривалості гри — краще уточнити в адміністратора.</p>
  <div><label for="key">Ключ персоналу</label><input id="key" type="password" autocomplete="off"></div>
  <div><label for="code">Код призу</label><input id="code" maxlength="8" autocomplete="off" autocapitalize="characters" spellcheck="false"></div>
  <button id="check" type="button">Перевірити</button>
  <div class="result" id="result">
    <h2 id="verdict"></h2>
    <div id="details"></div>
    <button id="redeem" type="button" style="margin-top:12px">Видати приз</button>
  </div>
</main>
<script>
  const GAMES = { snake: 'Пітон', blocks: 'Прораб', dryer: 'Фенікс', fade: 'Фейдзілла', beard: 'Бородоріз' };
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  try { $('key').value = sessionStorage.getItem('prizeKey') || ''; } catch (e) {}

  async function call(method, body) {
    const key = $('key').value.trim();
    try { sessionStorage.setItem('prizeKey', key); } catch (e) {}
    const code = $('code').value.trim().toUpperCase();
    const url = method === 'GET' ? '/api/prize?code=' + encodeURIComponent(code) : '/api/prize';
    const res = await fetch(url, {
      method, headers: { 'Content-Type': 'application/json', 'X-Admin-Key': key },
      body: method === 'POST' ? JSON.stringify({ code }) : undefined,
    });
    return { status: res.status, data: await res.json().catch(() => ({})) };
  }

  function show(status, data, justRedeemed) {
    $('result').classList.add('show');
    const v = $('verdict');
    if (status === 403) { v.textContent = 'Невірний ключ персоналу'; v.className = 'bad'; $('details').innerHTML = ''; $('redeem').hidden = true; return; }
    if (status === 404) { v.textContent = 'Такого коду немає'; v.className = 'bad'; $('details').innerHTML = ''; $('redeem').hidden = true; return; }
    if (status !== 200) { v.textContent = 'Помилка сервера (' + status + ')'; v.className = 'bad'; $('details').innerHTML = ''; $('redeem').hidden = true; return; }
    const done = !!data.redeemed_at;
    v.textContent = justRedeemed ? (data.already_redeemed ? 'Цей приз уже видавали' : 'Приз видано ✓')
      : done ? 'Код справжній, але приз уже видано' : 'Код справжній ✓';
    v.className = justRedeemed && !data.already_redeemed ? 'ok' : done ? 'bad' : 'ok';
    const when = done ? new Date(Number(data.redeemed_at) * 1000).toLocaleString('uk-UA') : '—';
    $('details').innerHTML = [
      ['Переможець', data.name], ['Гра', GAMES[data.game] || data.game], ['Місяць', data.month],
      ['Рахунок', data.score],
      ['Тривалість рекордної гри', data.duration == null ? '—' : Math.floor(data.duration / 60) + ' хв ' + (data.duration % 60) + ' с'],
      ['Видано', when],
    ].map(([k, val]) => `<div class="row"><span>${k}</span><span>${esc(val)}</span></div>`).join('');
    $('redeem').hidden = done;
  }

  $('check').addEventListener('click', async () => { const r = await call('GET'); show(r.status, r.data, false); });
  $('redeem').addEventListener('click', async () => { const r = await call('POST'); show(r.status, r.data, true); });
</script>
</body>
</html>
