<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Ідеї ігор</title>
<style>
  :root { --bg: #120d0f; --card: #1d1416; --line: rgba(214,150,160,.25); --accent: #e4b8b2; --accent-hi: #f5d9d4; --cream: #f3ebe8; --muted: #a8939a; --red: #e0433a; }
  * { box-sizing: border-box; margin: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--cream); padding: 24px 16px; }
  main { max-width: 640px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
  h1 { color: var(--accent); font-size: 24px; }
  label { font-size: 13px; color: var(--muted); display: block; margin-bottom: 6px; }
  input { width: 100%; font-size: 17px; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--card); color: var(--cream); }
  button { width: 100%; font-size: 17px; font-weight: 800; padding: 14px; border-radius: 12px; border: 0; cursor: pointer; background: linear-gradient(135deg, var(--accent-hi), var(--accent)); color: #1c1113; }
  .idea { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; }
  .idea h2 { font-size: 17px; margin-bottom: 4px; }
  .meta { color: var(--muted); font-size: 13px; margin-bottom: 8px; }
  .text { white-space: pre-wrap; line-height: 1.45; }
  .msg { color: var(--muted); text-align: center; padding: 20px; }
  .bad { color: var(--red); }
</style>
</head>
<body>
<main>
  <h1>💡 Ідеї ігор від гравців</h1>
  <div><label for="key">Ключ персоналу</label><input id="key" type="password" autocomplete="off"></div>
  <button id="load" type="button">Показати ідеї</button>
  <div id="list"></div>
</main>
<script>
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  try { $('key').value = sessionStorage.getItem('prizeKey') || ''; } catch (e) {}
  $('load').addEventListener('click', async () => {
    const key = $('key').value.trim();
    try { sessionStorage.setItem('prizeKey', key); } catch (e) {}
    $('list').innerHTML = '<p class="msg">Завантаження…</p>';
    const res = await fetch('/api/idea', { headers: { 'X-Admin-Key': key } });
    const data = await res.json().catch(() => ({}));
    if (res.status === 403) { $('list').innerHTML = '<p class="msg bad">Невірний ключ персоналу</p>'; return; }
    if (!res.ok) { $('list').innerHTML = `<p class="msg bad">Помилка (${res.status})</p>`; return; }
    if (!data.ideas.length) { $('list').innerHTML = '<p class="msg">Поки що ідей немає</p>'; return; }
    $('list').innerHTML = data.ideas.map((i) => `
      <div class="idea">
        <h2>${esc(i.title || 'Без назви')}</h2>
        <div class="meta">${esc(i.name)}${i.username ? ' · <a style="color:var(--accent)" href="https://t.me/' + esc(i.username) + '">@' + esc(i.username) + '</a>' : ''} · ${new Date(i.t * 1000).toLocaleString('uk-UA')}${i.sent ? ' · надіслано: ' + esc(i.sent.join(', ')) : ''}</div>
        <div class="text">${esc(i.text)}</div>
      </div>`).join('');
  });
</script>
</body>
</html>
